{% extends "base.html" %}

{% block title %}Удалить статью — PulseNews{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-body">
                <h1 class="h4 text-danger mb-3">Удалить статью?</h1>
                <p>
                    Вы собираетесь удалить статью
                    <strong>«{{ object.title }}»</strong>.
                    Это действие необратимо, комментарии тоже будут удалены.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Удалить
                        </button>
                        <a href="{% url 'authors:my_articles' %}" class="btn btn-outline-secondary">
                            Отмена
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
