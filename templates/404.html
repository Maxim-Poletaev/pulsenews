{% extends "base.html" %}

{% block title %}404 — Страница не найдена{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold">404</div>
    <h1 class="h3 mt-3">Страница не найдена</h1>
    <p class="text-muted">
        Возможно, статья была удалена, архивна или вы ошиблись в адресе.
    </p>
    <div class="d-flex gap-2 justify-content-center mt-4">
        <a href="{% url 'news:home' %}" class="btn btn-warning">
            <i class="bi bi-house"></i> На главную
        </a>
        <a href="{% url 'news:article_list' %}" class="btn btn-outline-secondary">
            Все новости
        </a>
    </div>
</div>
{% endblock %}
